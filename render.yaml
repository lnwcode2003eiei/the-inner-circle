services:
  - type: web
    name: inner-circle-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: CLIENT_URL
        sync: false

